services:
  db:
    image: mariadb:10.11
    container_name: nrl-prosjekt-gr14-2025h-db-1
    environment:
      MYSQL_DATABASE: nrl
      MYSQL_USER: student
      MYSQL_PASSWORD: studentpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-prootpass"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysqldata:/var/lib/mysql

  webapplication1:
    build:
      context: .
      dockerfile: WebApplication1/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:8080"
      ASPNETCORE_ENVIRONMENT: Development
      # Important: use the service name "db" inside the Compose network
      ConnectionStrings__DefaultConnection: server=db;port=3306;database=nrl;user=root;password=rootpass
    ports:
      - "8080:8080"
    volumes:
      - ./WebApplication1/wwwroot/images:/app/wwwroot/images

volumes:
  mysqldata:
    name: nrl-db-data
